<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"><title>桌面歌词</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent}body{font-family:'Microsoft YaHei UI',sans-serif;color:white;user-select:none}.overlay{height:100%;display:flex;align-items:center;justify-content:center;padding:12px 32px;cursor:move;-webkit-app-region:drag;text-align:center}.lyrics-content{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}.line{max-width:100%;font-size:26px;font-weight:700;line-height:1.25;text-shadow:0 2px 4px #000,1px 1px 3px #000,-1px -1px 3px #000;white-space:normal;overflow-wrap:anywhere}#text span{display:inline-block;white-space:pre;text-shadow:none;filter:drop-shadow(0 1px 2px #000)}.trans{font-size:17px;font-weight:600;margin-top:4px}.close{position:absolute;right:10px;top:8px;border:0;border-radius:50%;width:26px;height:26px;background:#222a;color:white;font-size:20px;line-height:24px;cursor:pointer;opacity:0;-webkit-app-region:no-drag}.overlay:hover .close,.close:focus-visible{opacity:1}
.overlay{padding:0;overflow:hidden;border-radius:12px;border:var(--border-width,2px) solid transparent;background:transparent}.overlay.has-border{border-color:rgba(var(--border-rgb,255,255,255),var(--border-alpha,.7))}.overlay.glass{background:linear-gradient(135deg,rgba(245,247,255,.24),rgba(200,214,233,.14));backdrop-filter:blur(20px) saturate(145%);box-shadow:inset 0 1px 1px #ffffff45,inset 0 0 18px #ffffff1a}.lyrics-content{padding:8px 24px}.line{font-size:var(--font-size,26px)}.trans{font-size:calc(var(--font-size,26px)*.65)}.resize-handle{position:absolute;right:0;bottom:0;width:26px;height:26px;z-index:3;cursor:nwse-resize;-webkit-app-region:no-drag}.resize-handle:after{content:'';position:absolute;bottom:4px;right:4px;width:10px;height:10px;border-bottom:2px solid #fffc;border-right:2px solid #fffc;filter:drop-shadow(0 1px 2px #000)}
.overlay{position:relative}.close{right:44px}.lyrics-content{position:absolute;left:46px;right:46px;top:0;bottom:0;z-index:2;width:auto;padding:0 8px;overflow:hidden;pointer-events:none}.overlay.has-spectrum .lyrics-content{bottom:calc(clamp(6px,58% - 32px,72px) + 4px)}.spectrum{position:absolute;z-index:1;bottom:3px;left:5%;width:90%;height:clamp(6px,58% - 32px,72px);pointer-events:none;opacity:.82}.controls{position:absolute;right:8px;top:6px;bottom:28px;z-index:4;display:flex;flex-direction:column;justify-content:center;gap:3px;-webkit-app-region:no-drag}.control{width:30px;height:30px;min-height:0;flex:0 1 30px;border:1px solid #7779;border-radius:7px;background:#202020a8;color:#fff;cursor:pointer;display:grid;place-items:center}.control:hover{background:#202020e8}.control svg{width:16px;height:16px}.control.liked{color:#ff536a}.bubble{position:absolute;z-index:5;left:12px;top:8px;max-width:calc(100% - 85px);padding:5px 9px;border-radius:12px;background:#fff3f5e8;color:#8b233c;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}.overlay.glass{background:linear-gradient(135deg,rgba(245,247,255,var(--glass-a,.02)),rgba(200,214,233,var(--glass-b,.01)));backdrop-filter:blur(var(--glass-blur,0px)) saturate(145%);box-shadow:inset 0 1px 2px #ffffffa0,inset 1px 0 2px #ffffff60,inset -1px -1px 2px #263a5035,0 2px 8px #0002}
</style></head><body><div class="overlay" title="拖动移动桌面歌词"><button class="close" type="button" aria-label="关闭桌面歌词">×</button><canvas class="spectrum" id="spectrum" hidden aria-hidden="true"></canvas><div class="bubble" id="like-bubble" hidden role="status"></div><div class="lyrics-content" id="content"><div class="line" id="text">暂无歌词</div><div class="line trans" id="trans"></div></div><div class="controls"><button class="control" id="mute" type="button" aria-label="本机静音" title="本机静音"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="sound-wave" d="M16 8c2 2 2 6 0 8M19 5c4 4 4 10 0 14"/></svg></button><button class="control" id="like" type="button" aria-label="点赞当前歌曲" title="点赞当前歌曲"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.7a5.5 5.5 0 0 0-7.8 0l-1 1-1-1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.5a5.5 5.5 0 0 0 0-7.8z"/></svg></button></div><div class="resize-handle" aria-label="拖动调整桌面歌词大小"></div></div><script src="lyrics.js"></script></body></html>
